<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="591代购">
    <title>591代购</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            border-radius: 20px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .status {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
        }
        
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .progress-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            min-height: 40px;
            line-height: 1.4;
        }
        
        .error-container {
            display: none;
        }
        
        .error-container.show {
            display: block;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .error-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ff6b6b;
        }
        
        .error-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
            margin-top: 12px;
        }
        
        .loading-container {
            display: block;
        }
        
        .loading-container.hide {
            display: none;
        }
        
        .footer {
            position: fixed;
            bottom: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .footer a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 加载中界面 -->
        <div class="loading-container" id="loadingContainer">
            <div class="logo">🛒</div>
            <h1>591代购</h1>
            <p class="status">正在连接服务器...</p>
            <div class="loader"></div>
            <p class="progress-text" id="progressText">正在获取最新网址...</p>
        </div>
        
        <!-- 错误界面 -->
        <div class="error-container" id="errorContainer">
            <div class="error-icon">😔</div>
            <h2 class="error-title">连接失败</h2>
            <p class="error-message" id="errorMessage">无法连接到服务器，请检查网络后重试。</p>
            <button class="btn" onclick="retry()">重新连接</button>
            <br>
            <button class="btn btn-secondary" onclick="openDownloadPage()">重新安装APP</button>
        </div>
    </div>
    
    <div class="footer">
        如遇问题请访问 <a href="download.html">下载页面</a>
    </div>

    <script>
        // ============================================
        // 配置区域 - 可根据需要修改
        // ============================================
        
        // 配置源列表（按优先级排序）
        const CONFIG_SOURCES = [
            {
                name: 'LeanCloud',
                type: 'leancloud',
                url: 'https://1zyv7ioc.api.lncldglobal.com/1.1/classes/AppConfig',
                appId: '1zYv7IocFZU9l0R4eveWEKgJ-MdYXbMMI',
                appKey: '4saeruY6UIAMAa8vwPTYGKoL',
                timeout: 3000
            },
            {
                name: 'GitHub',
                type: 'github',
                url: 'https://raw.githubusercontent.com/daniu888-li/ceshi/main/config.json',
                timeout: 5000
            },
            {
                name: 'VPS',
                type: 'vps',
                url: 'https://591daigou.com/config.json',
                timeout: 5000
            }
        ];
        
        // 硬编码的备用网址（当所有配置源都失败时使用）
        const FALLBACK_URLS = [
            'https://591daigou.com/',
            'https://178koko.vip/',
            'https://www.qidian.com/'
        ];
        
        // 缓存配置
        const CACHE_KEY = 'ios_app_config';
        const CACHE_URL_KEY = 'ios_app_last_url';
        const CACHE_EXPIRY_HOURS = 24;
        
        // ============================================
        // 主逻辑
        // ============================================
        
        let currentStep = 0;
        
        // 更新进度文字
        function updateProgress(text) {
            document.getElementById('progressText').textContent = text;
        }
        
        // 显示错误
        function showError(message) {
            document.getElementById('loadingContainer').classList.add('hide');
            document.getElementById('errorContainer').classList.add('show');
            document.getElementById('errorMessage').textContent = message;
        }
        
        // 重试
        function retry() {
            document.getElementById('loadingContainer').classList.remove('hide');
            document.getElementById('errorContainer').classList.remove('show');
            startLoading();
        }
        
        // 打开下载页
        function openDownloadPage() {
            window.location.href = 'download.html';
        }
        
        // 跳转到目标网址
        function redirectTo(url) {
            updateProgress('正在跳转...');
            // 保存成功的网址到缓存
            saveToCache(CACHE_URL_KEY, url);
            // 延迟一点点再跳转，让用户看到"正在跳转"
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }
        
        // 缓存操作
        function saveToCache(key, data) {
            try {
                const cacheData = {
                    data: data,
                    timestamp: Date.now()
                };
                localStorage.setItem(key, JSON.stringify(cacheData));
            } catch (e) {
                console.warn('缓存保存失败:', e);
            }
        }
        
        function getFromCache(key, maxAgeHours = CACHE_EXPIRY_HOURS) {
            try {
                const cached = localStorage.getItem(key);
                if (!cached) return null;
                
                const cacheData = JSON.parse(cached);
                const ageHours = (Date.now() - cacheData.timestamp) / (1000 * 60 * 60);
                
                if (ageHours > maxAgeHours) {
                    localStorage.removeItem(key);
                    return null;
                }
                
                return cacheData.data;
            } catch (e) {
                console.warn('缓存读取失败:', e);
                return null;
            }
        }
        
        // 检测网址是否可访问
        async function checkUrlAccessible(url, timeout = 5000) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                
                const response = await fetch(url, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                return true;
            } catch (e) {
                return false;
            }
        }
        
        // 从 LeanCloud 获取配置
        async function fetchFromLeanCloud(source) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), source.timeout);
            
            try {
                const response = await fetch(source.url, {
                    method: 'GET',
                    headers: {
                        'X-LC-Id': source.appId,
                        'X-LC-Key': source.appKey,
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    const config = data.results[0];
                    return {
                        main_url: config.main_url,
                        backup_urls: config.backup_urls || []
                    };
                }
                
                throw new Error('配置为空');
            } catch (e) {
                clearTimeout(timeoutId);
                throw e;
            }
        }
        
        // 从 GitHub/VPS 获取配置
        async function fetchFromUrl(source) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), source.timeout);
            
            try {
                const response = await fetch(source.url, {
                    method: 'GET',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const config = await response.json();
                
                if (config.main_url) {
                    return {
                        main_url: config.main_url,
                        backup_urls: config.backup_urls || []
                    };
                }
                
                throw new Error('配置格式错误');
            } catch (e) {
                clearTimeout(timeoutId);
                throw e;
            }
        }
        
        // 从配置源获取配置
        async function fetchConfig(source) {
            if (source.type === 'leancloud') {
                return await fetchFromLeanCloud(source);
            } else {
                return await fetchFromUrl(source);
            }
        }
        
        // 尝试所有配置源
        async function tryAllConfigSources() {
            for (const source of CONFIG_SOURCES) {
                updateProgress(`正在尝试 ${source.name}...`);
                
                try {
                    const config = await fetchConfig(source);
                    console.log(`从 ${source.name} 获取配置成功:`, config);
                    
                    // 保存到缓存
                    saveToCache(CACHE_KEY, config);
                    
                    return config;
                } catch (e) {
                    console.warn(`从 ${source.name} 获取配置失败:`, e.message);
                }
            }
            
            return null;
        }
        
        // 找到可用的网址
        async function findWorkingUrl(urls) {
            for (let i = 0; i < urls.length; i++) {
                const url = urls[i];
                updateProgress(`正在检测网址 (${i + 1}/${urls.length})...`);
                
                // 对于第一个网址，直接尝试跳转（节省时间）
                if (i === 0) {
                    return url;
                }
                
                // 其他网址先检测
                const isAccessible = await checkUrlAccessible(url, 3000);
                if (isAccessible) {
                    return url;
                }
            }
            
            // 如果都检测失败，返回第一个（让用户自己看结果）
            return urls[0] || null;
        }
        
        // 主加载流程
        async function startLoading() {
            try {
                // 1. 先检查缓存的网址（快速启动）
                const cachedUrl = getFromCache(CACHE_URL_KEY, 1); // 1小时内的缓存
                if (cachedUrl) {
                    updateProgress('使用缓存网址...');
                    redirectTo(cachedUrl);
                    return;
                }
                
                // 2. 尝试从配置源获取
                updateProgress('正在获取最新配置...');
                let config = await tryAllConfigSources();
                
                // 3. 如果配置源都失败，尝试使用缓存的配置
                if (!config) {
                    const cachedConfig = getFromCache(CACHE_KEY, 72); // 72小时内的缓存
                    if (cachedConfig) {
                        updateProgress('使用缓存配置...');
                        config = cachedConfig;
                    }
                }
                
                // 4. 构建网址列表
                let urlsToTry = [];
                
                if (config) {
                    urlsToTry.push(config.main_url);
                    if (config.backup_urls && config.backup_urls.length > 0) {
                        urlsToTry = urlsToTry.concat(config.backup_urls);
                    }
                }
                
                // 添加硬编码的备用网址
                for (const fallbackUrl of FALLBACK_URLS) {
                    if (!urlsToTry.includes(fallbackUrl)) {
                        urlsToTry.push(fallbackUrl);
                    }
                }
                
                // 5. 找到可用的网址并跳转
                if (urlsToTry.length > 0) {
                    const workingUrl = await findWorkingUrl(urlsToTry);
                    if (workingUrl) {
                        redirectTo(workingUrl);
                        return;
                    }
                }
                
                // 6. 全部失败
                showError('无法连接到任何服务器，请检查网络连接后重试。');
                
            } catch (e) {
                console.error('加载出错:', e);
                showError('加载过程中出现错误，请重试。');
            }
        }
        
        // 页面加载完成后开始
        document.addEventListener('DOMContentLoaded', function() {
            // 延迟一点点开始，让页面先渲染
            setTimeout(startLoading, 100);
        });
    </script>
</body>
</html>
